name: Deploy frontend to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - "backend/src/router.ts"
      - "backend/src/routers/**"
      - ".github/workflows/deploy-frontend.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.4.1

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm run build:types

      - name: Build frontend
        env:
          # repo 名稱要跟 GitHub Pages 的子路徑一致：https://<user>.github.io/<repo>/
          VITE_BASE_PATH: /${{ github.event.repository.name }}/
          # 在 repo Settings → Secrets and variables → Actions → Variables
          # 新增 API_BASE_URL，指向已部署的 Cloudflare Worker 網址
          # （例如 https://signal-ledger-backend.<你的子網域>.workers.dev）。
          VITE_API_BASE_URL: ${{ vars.API_BASE_URL }}
        run: pnpm --filter @signal-ledger/frontend build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
