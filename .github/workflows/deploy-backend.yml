name: Deploy backend to Cloudflare Workers

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/deploy-backend.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.4.1

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm --filter @signal-ledger/backend run check

      # 需要在 repo Settings → Secrets and variables → Actions → Secrets
      # 新增 CLOUDFLARE_API_TOKEN 與 CLOUDFLARE_ACCOUNT_ID（見 README「部署後端」）。
      # ADMIN_TOKEN / ANTHROPIC_API_KEY / ALERT_WEBHOOK_URL 這些是 Worker 自己的
      # secrets，用 `wrangler secret put` 手動設定一次即可，不需要放進 GitHub Actions。
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: backend
          command: deploy
